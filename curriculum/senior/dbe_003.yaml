id: dbe_003
title: Page path from event JSON
primary_skill: json_semi_structured
secondary_skills: [filter_where]
difficulty: 4
dataset: platform
module: database_engineering
prerequisites: [filter_where]

prompt: >
  From `events` where `event_name` is `'page_view'`, return `event_id` and
  the `page` value stored in `properties_json`.

concept: Semi-structured columns are still queried with predicates, not by parsing in the app.
teach: >
  SQLite exposes json_extract(json, '$.page'). PostgreSQL JSONB uses
  properties_json->>'page'. Keep the extraction in SQL so filters can use
  generated columns or functional indexes later.

schema:
  - events

evaluation:
  mode: result_set
  order_matters: false
  require_column_names: false

reference:
  sql: |
    SELECT event_id, json_extract(properties_json, '$.page')
    FROM events
    WHERE event_name = 'page_view';

hints:
  - level: 1
    text: The path is inside the JSON payload, not its own column.
  - level: 2
    text: Filter `event_name` first, then read `properties_json`.
  - level: 3
    text: json_extract(properties_json, '$.page').
  - level: 4
    text: |
      SELECT event_id, json_extract(properties_json, '$.page')
      FROM events
      WHERE event_name = 'page_view';

common_errors:
  - tag: misread_requirement
    explanation: Returning the raw JSON blob is not the page path.
